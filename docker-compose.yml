services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: enclave_dev
      POSTGRES_DB: enclave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclave"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
